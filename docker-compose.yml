version: "3.7"

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - POCKETBASE_ADMIN_EMAIL=pocketbase@ndw.com
      - POCKETBASE_ADMIN_PASSWORD=pocketbaseEnjoyer
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build: .
    container_name: chatbot-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - REACT_APP_POCKETBASE_URL=http://pocketbase:8090
      - REACT_APP_PB_SUPER_EMAIL=pocketbase@ndw.com
      - REACT_APP_PB_SUPER_PW=pocketbaseEnjoyer
    networks:
      - app-network

networks:
  app-network:
    driver: bridge