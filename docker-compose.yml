version: "3.7"

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      args:
        - REACT_APP_POCKETBASE_URL=${REACT_APP_POCKETBASE_URL}
        - REACT_APP_PB_SUPER_EMAIL=${REACT_APP_PB_SUPER_EMAIL}
        - REACT_APP_PB_SUPER_PW=${REACT_APP_PB_SUPER_PW}
    container_name: chatbot-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - REACT_APP_POCKETBASE_URL=${REACT_APP_POCKETBASE_URL}
      - REACT_APP_PB_SUPER_EMAIL=${REACT_APP_PB_SUPER_EMAIL}
      - REACT_APP_PB_SUPER_PW=${REACT_APP_PB_SUPER_PW}
      - NODE_ENV=production
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge